              400: '#60a5fa',

  <style>
    /* =========================================================
       CLOUDFLARE / LINEAR DESIGN SYSTEM SPECIFICATION
       High-density, information-rich, electric blue & charcoal

      --text-soft: #71717a;

      --accent-color: #3b82f6;

      --nav-inactive-text: #94a3b8;

    body {

    }
    .theme-header {
      background-color: var(--bg-header) !important;
      border-color: var(--border-header) !important;

      -webkit-backdrop-filter: blur(16px);

    /* Elevated Surface Cards */
    .glass-card, .pitch-card {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);

    html:not(.dark) .glass-card, html:not(.dark) .pitch-card {

    }

      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);

    .pitch-input {

      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pitch-input:focus {

      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25) !important;
    }

    /* Enterprise Tabular Figures & Subtle Grid Surface */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

        linear-gradient(to right, rgba(59, 130, 246, 0.06) 1px, transparent 1px),

    }
    .dropzone-active {

      background-color: rgba(59, 130, 246, 0.06) !important;

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

        animation-iteration-count: 1 !important;

    /* Electric Blue Brand Buttons */

    /* Sidebar Navigation Item */
    .sidebar-nav-item {
      display: flex;

      padding: 0.5rem 0.75rem;

    }
    .sidebar-nav-item.active {

    }

    }

    /* Collapsed Sidebar Icon with Tooltip */
    .sidebar-collapsed-item {

    }

    .custom-scrollbar::-webkit-scrollbar {

    }

    }

    }

    }

    /* Tab entrance transition */
    .tab-pane-enter {
      animation: tabEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes tabEnter {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Modal entrance transition */
    .modal-backdrop-enter {
      animation: modalFade 0.2s ease-out forwards;
    }
    .modal-box-enter {
      animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Responsive/mobile layout fixes */
    html, body { max-width: 100%; overflow-x: hidden; }

    /* File Card and Row Hover Styling - Refined Linear/Cloudflare styling */
    .file-grid-card {

    html:not(.dark) .file-grid-card:hover {

      border-color: #3b82f6 !important;

    }
    html.dark .file-grid-card:hover {

      border-color: rgba(59, 130, 246, 0.4) !important;

    .file-list-row {

    html:not(.dark) .file-list-row:hover {

    }

    }

    }

    /* =========================================================
       OTP VERIFICATION ORBIT, MERGE, RECOIL & RECHARGE ANIMATIONS
       ========================================================= */
    .otp-stage-container {
      position: relative;
      perspective: 1000px;
    }

    .otp-box-slot {
      position: relative;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, border-color 0.3s ease;
      will-change: transform, opacity;
    }

    .otp-input-element {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .otp-input-element:focus {
      transform: translateY(-2px);
    }

    /* 1. Circular Orbit & Merge Sequence */
    .otp-anim-orbit-0 {
      animation: otpOrbitMerge0 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    .otp-anim-orbit-1 {
      animation: otpOrbitMerge1 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    .otp-anim-orbit-2 {
      animation: otpOrbitMerge2 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }
    .otp-anim-orbit-3 {
      animation: otpOrbitMerge3 1.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    @keyframes otpOrbitMerge0 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(25px, -55px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(84px, 0px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(84px, 45px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(84px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes otpOrbitMerge1 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(45px, 25px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(28px, 45px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(-20px, -25px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(28px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes otpOrbitMerge2 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(-45px, -25px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(-28px, -45px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(20px, 25px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(-28px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes otpOrbitMerge3 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      25% {
        transform: translate(-25px, 55px) scale(0.95) rotate(90deg);
        opacity: 0.9;
      }
      50% {
        transform: translate(-84px, 0px) scale(0.85) rotate(180deg);
        opacity: 0.8;
      }
      75% {
        transform: translate(-84px, -45px) scale(0.7) rotate(270deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(-84px, 0px) scale(0.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* 2. Central Fusion Core and Tick Success Badge */
    .otp-fusion-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 58px;
      height: 58px;
      margin-top: -29px;
      margin-left: -29px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.2) rotate(0deg);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .otp-fusion-active {
      opacity: 1 !important;
      transform: scale(1) rotate(360deg) !important;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
    }

    .otp-success-glow {
      opacity: 1 !important;
      transform: scale(1.15) rotate(360deg) !important;
      background: #10b981 !important;
      color: #000000 !important;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.6) !important;
    }

    /* 3. Repulsion Effect when OTP is Wrong */
    .otp-anim-repulse-0 {
      animation: otpRepulse0 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }
    .otp-anim-repulse-1 {
      animation: otpRepulse1 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }
    .otp-anim-repulse-2 {
      animation: otpRepulse2 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }
    .otp-anim-repulse-3 {
      animation: otpRepulse3 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
    }

    @keyframes otpRepulse0 {
      0% {
        transform: translate(84px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(-110px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(-65px, 0) scale(0.95);
      }
      85% {
        transform: translate(-82px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes otpRepulse1 {
      0% {
        transform: translate(28px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(-45px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(-18px, 0) scale(0.95);
      }
      85% {
        transform: translate(-28px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes otpRepulse2 {
      0% {
        transform: translate(-28px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(45px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(18px, 0) scale(0.95);
      }
      85% {
        transform: translate(28px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes otpRepulse3 {
      0% {
        transform: translate(-84px, 0) scale(0.3);
        opacity: 0.3;
      }
      35% {
        transform: translate(110px, 0) scale(1.18);
        opacity: 1;
      }
      65% {
        transform: translate(65px, 0) scale(0.95);
      }
      85% {
        transform: translate(82px, 0) scale(1.04);
      }
      100% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
    }

    /* 4. Box Shake on Error */
    .otp-error-shake {
      animation: otpShakeBox 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes otpShakeBox {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .animate-slide-down {
      animation: otpSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes otpSlideDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Desktop Viewport & Application Root Locking */
    html, body {
      height: 100%;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    #app {
      height: 100%;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      html, body, #app {
        height: 100vh !important;
        height: 100dvh !important;
        overflow: hidden !important;
      }
    }

    @media (max-width: 767px) {
      #file-preview-drawer {
        width: 100vw;
      }
      .mobile-stack { flex-direction: column !important; align-items: stretch !important; }
      .mobile-full { width: 100% !important; }
    }
  </style>
</head>
